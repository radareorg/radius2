name: Release

env:
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  R2V: 6.0.8

on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gawk binutils build-essential
    - name: Install radare2
      run: |
        wget https://github.com/radareorg/radare2/releases/download/${{env.R2V}}/radare2_${{env.R2V}}_amd64.deb
        wget https://github.com/radareorg/radare2/releases/download/${{env.R2V}}/radare2-dev_${{env.R2V}}_amd64.deb
        sudo dpkg -i radare2_${{env.R2V}}_amd64.deb
        sudo dpkg -i radare2-dev_${{env.R2V}}_amd64.deb
    - name: Build
      run: cargo build --verbose --release
    - name: Run tests
      run: cargo test --workspace --verbose --release
    - name: Build Package
      run: |
        cd dist/debian
        make
        mv *.deb ../../target/release/
    - name: Upload artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: radius2-linux-x86_64
        path: |
          target/release/radius2
          target/release/*.deb

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install radare2
      run: |
        brew install radare2
    - name: Build
      run: cargo build --verbose --release
    - name: Run tests
      run: cargo test --workspace --verbose --release
    - name: Upload artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: radius2-macos-x86_64
        path: target/release/radius2

  build-windows:
    name: Check (Windows)
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Check
      # boolector-sys needs an external boolector.lib on x86_64-pc-windows-msvc.
      # Keep Windows compile coverage without requiring an unsupported final link.
      run: cargo check --workspace --all-targets --verbose --release

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, build-windows]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Download all artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: artifacts

    - name: Prepare release files
      run: |
        mkdir -p release
        cp artifacts/radius2-linux-x86_64/radius2 release/radius2-linux-x86_64
        cp artifacts/radius2-linux-x86_64/*.deb release/
        cp artifacts/radius2-macos-x86_64/radius2 release/radius2-macos-x86_64
    - name: Create GitHub Release
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
      with:
        files: |
          release/radius2-linux-x86_64
          release/*.deb
          release/radius2-macos-x86_64
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
